[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brewery-scraper"
version = "0.1.0"
description = "Fetch, normalize, classify, and export Brewers Association brewery data."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
brewery-scraper = "scraper.cli:main"

[tool.setuptools]
packages = ["scraper"]

[tool.setuptools.dynamic]
# requirements.txt stays the single source of truth for runtime versions.
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
